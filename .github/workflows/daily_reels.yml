name: Daily 10x Facebook Reels Autopilot

on:
  schedule:
    # Runs every 3 hours at minute 17 (e.g. 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17 UTC)
    # Checks state: if today's 10 reels are already scheduled, it finishes in 2 seconds.
    # If not (or if missed), it generates and schedules them immediately without delay!
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of Reels to generate and schedule (default: 10)'
        required: false
        default: '10'
      force:
        description: 'Force run even if already scheduled today'
        required: false
        type: boolean
        default: false
      immediate:
        description: 'Publish immediately instead of scheduling'
        required: false
        type: boolean
        default: false

concurrency:
  group: reels-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-post:
    name: Generate & Schedule 10 Reels
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish/Schedule Reels to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          VIDEOS_PER_DAY: ${{ github.event.inputs.count || secrets.VIDEOS_PER_DAY || '10' }}
          SCHEDULE_TIMEZONE: ${{ secrets.SCHEDULE_TIMEZONE || 'Asia/Kolkata' }}
          SDL_VIDEODRIVER: 'dummy'
        run: |
          ARGS="--cleanup"
          if [ "${{ github.event.inputs.count }}" != "" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.immediate }}" = "true" ]; then
            ARGS="$ARGS --immediate"
          fi
          python fb_auto_poster.py $ARGS

      - name: Commit State File
        if: always()
        run: |
          git config --global user.name "FlagBattle-Autopilot-Bot"
          git config --global user.email "bot@flagbattle.local"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update state [skip ci]" && git push)

      - name: Workflow Completion Notice
        run: |
          echo "🎉 Automated Reels pipeline finished successfully!"
          echo "Meta Graph API will publish the scheduled Reels automatically throughout the day."
