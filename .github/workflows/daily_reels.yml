name: Daily 10x Facebook Reels Autopilot

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST) - schedules all 10 slots for the day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of Reels to generate and schedule (default: 10)'
        required: false
        default: '10'
      immediate:
        description: 'Publish immediately instead of scheduling'
        required: false
        type: boolean
        default: false

concurrency:
  group: reels-automation
  cancel-in-progress: false

jobs:
  generate-and-post:
    name: Generate & Schedule 10 Reels
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish/Schedule Reels to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          VIDEOS_PER_DAY: ${{ github.event.inputs.count || secrets.VIDEOS_PER_DAY || '10' }}
          SCHEDULE_TIMEZONE: ${{ secrets.SCHEDULE_TIMEZONE || 'Asia/Kolkata' }}
          SDL_VIDEODRIVER: 'dummy'
        run: |
          if [ "${{ github.event.inputs.immediate }}" = "true" ]; then
            python fb_auto_poster.py --count "${{ github.event.inputs.count || '10' }}" --immediate --cleanup
          else
            python fb_auto_poster.py --count "${{ github.event.inputs.count || '10' }}" --cleanup
          fi

      - name: Workflow Completion Notice
        run: |
          echo "🎉 Automated 10x Reels pipeline finished successfully!"
          echo "Meta Graph API will publish the scheduled Reels automatically throughout the day."
