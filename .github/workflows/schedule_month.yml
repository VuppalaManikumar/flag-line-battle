name: Schedule 1 Month (300 Reels) to Facebook

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to schedule in advance (e.g. 7, 14, 30)'
        required: true
        default: '30'
      per_day:
        description: 'Number of Reels per day (default: 10)'
        required: true
        default: '10'
      start_day:
        description: 'Start day offset: 1 = tomorrow (default: 1)'
        required: true
        default: '1'

concurrency:
  group: month-batch-scheduler
  cancel-in-progress: false

jobs:
  schedule-month:
    name: Batch Schedule 1 Month to Meta
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1-Month Batch Scheduler
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SDL_VIDEODRIVER: 'dummy'
        run: |
          python schedule_1_month.py --days ${{ github.event.inputs.days }} --per-day ${{ github.event.inputs.per_day }} --start-day ${{ github.event.inputs.start_day }}

      - name: Complete Batch Notice
        run: |
          echo "🎉 1-Month Advance Scheduling Completed!"
          echo "All requested Reels are queued in Meta Business Suite and will publish automatically!"
